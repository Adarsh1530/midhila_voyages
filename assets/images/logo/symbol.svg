<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Decorative Ring -->
  <circle cx="50" cy="50" r="46" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6"/>
  <circle cx="50" cy="50" r="42" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Subtle Cardinal Ticks -->
  <line x1="50" y1="4" x2="50" y2="10" stroke="#00A896" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="90" x2="50" y2="96" stroke="#00A896" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="50" x2="10" y2="50" stroke="#00A896" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="50" x2="96" y2="50" stroke="#00A896" stroke-width="2" stroke-linecap="round"/>

  <!-- North Star / Stylized Compass Rose -->
  <!-- North Spear (Gold) -->
  <path d="M50 14L55 45L50 50L45 45Z" fill="url(#goldGrad)"/>
  <path d="M50 14L50 50L45 45Z" fill="#A37E36"/>
  
  <!-- South Spear (Teal) -->
  <path d="M50 86L55 55L50 50L45 55Z" fill="url(#tealGrad)"/>
  <path d="M50 86L50 50L45 55Z" fill="#028090"/>

  <!-- East Spear (Gold) -->
  <path d="M86 50L55 55L50 50L55 45Z" fill="url(#goldGrad)"/>
  <path d="M86 50L50 50L55 45Z" fill="#A37E36"/>

  <!-- West Spear (Teal) -->
  <path d="M14 50L45 55L50 50L45 45Z" fill="url(#tealGrad)"/>
  <path d="M14 50L50 50L45 45Z" fill="#028090"/>

  <!-- Diagonal Sub-points -->
  <polygon points="50,50 68,32 55,47" fill="#DFBA73" opacity="0.8"/>
  <polygon points="50,50 68,68 55,53" fill="#02C39A" opacity="0.8"/>
  <polygon points="50,50 32,68 45,53" fill="#02C39A" opacity="0.8"/>
  <polygon points="50,50 32,32 45,47" fill="#DFBA73" opacity="0.8"/>

  <!-- Center Jewel Hub -->
  <circle cx="50" cy="50" r="5" fill="#06101E" stroke="#C5A059" stroke-width="2"/>
  <circle cx="50" cy="50" r="2" fill="#00A896"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBD49B"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9C772F"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02C39A"/>
      <stop offset="100%" stop-color="#028090"/>
    </linearGradient>
  </defs>
</svg>

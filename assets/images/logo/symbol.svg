<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Midhila Voyages Emblem Symbol -->
  <defs>
    <linearGradient id="symGoldSwoosh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F3A516"/>
    </linearGradient>
    <linearGradient id="symPlaneGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="symGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="50" cy="50" r="47" fill="#0A1428" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="50" cy="50" r="43" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Cursive 'M' -->
  <path d="M22 58 C 20 52, 23 40, 29 36 C 33 33, 37 35, 38 41 C 40 35, 45 33, 49 37 C 52 40, 54 48, 51 58" 
        stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M28 38 C 31 46, 33 53, 35 58" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Golden Arched Swoosh under M -->
  <path d="M16 68 C 34 78, 62 78, 86 54 C 77 62, 55 69, 28 65 Z" 
        fill="url(#symGoldSwoosh)" filter="url(#symGlow)"/>

  <!-- Jet Airplane taking off -->
  <g transform="translate(56, 20) rotate(5)">
    <path d="M10 22 L20 16 L33 5 C35 3, 38 5, 37 7 L32 15 L38 18 L37 22 L30 20 L26 29 L22 27 L24 19 L13 21 Z" 
          fill="url(#symPlaneGrad)" filter="url(#symGlow)"/>
  </g>
</svg>

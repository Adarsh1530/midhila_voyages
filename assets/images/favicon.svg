<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Midhila Voyages Official Emblem Favicon -->
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A33"/>
      <stop offset="100%" stop-color="#050B18"/>
    </linearGradient>
    <linearGradient id="goldSwoosh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F3A516"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="64" cy="64" r="61" fill="url(#badgeBg)" stroke="#F59E0B" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="56" stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Letter 'M' in cursive script style -->
  <path d="M26 72 C 24 64, 27 50, 35 44 C 40 40, 45 43, 46 50 C 49 43, 55 40, 60 45 C 64 49, 66 58, 63 72" 
        stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M34 46 C 37 55, 40 65, 43 72" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

  <!-- Golden Arched Swoosh under M -->
  <path d="M20 84 C 42 96, 76 96, 106 68 C 96 76, 70 85, 34 80 Z" 
        fill="url(#goldSwoosh)" filter="url(#glow)"/>

  <!-- Jet Airplane taking off toward top-right -->
  <g transform="translate(68, 26) rotate(5)">
    <!-- Wings and fuselage -->
    <path d="M12 28 L24 20 L40 6 C42 4, 46 6, 45 9 L39 19 L46 22 L45 27 L37 25 L32 36 L27 34 L29 24 L16 26 Z" 
          fill="url(#planeGrad)" filter="url(#glow)"/>
  </g>
</svg>
